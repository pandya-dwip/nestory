</div>

<script>
        // Placeholder clear on focus for contenteditable
        document.querySelectorAll('[contenteditable]').forEach(el => {
            el.addEventListener('focus', function() {
                if (this.textContent.trim() === this.getAttribute('data-placeholder') || this.textContent.trim() === 'Your Name') {
                    this.textContent = '';
                }
            });
            el.addEventListener('blur', function() {
                if (this.textContent.trim() === '') {
                    this.textContent = this.getAttribute('data-placeholder') || 'Your Name';
                }
            });
            
            // Prevent newlines in name field
            if(el.tagName === 'H1') {
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        el.blur();
                    }
                });
            }
        });
    </script>
